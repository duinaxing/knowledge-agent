name: Project knowledge agent
on: [push, pull_request]
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e './backend[test]'
      - run: pytest backend/tests -q
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: knowledge, POSTGRES_PASSWORD: knowledge, POSTGRES_DB: knowledge}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U knowledge' --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@localhost:5432/knowledge
      MODEL_MODE: test
      SEED_PASSWORD: ci-synthetic-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e './backend[test]'
      - run: python -m knowledge_agent.bootstrap --migrate --seed --index --publish-synthetic
      - run: python backend/integration/check_postgres.py
