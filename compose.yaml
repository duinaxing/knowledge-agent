services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes: ["database:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 3s
      timeout: 3s
      retries: 30
  init:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@db:5432/knowledge
      FILE_ROOT: /data/files
    command: ["python", "-m", "knowledge_agent.bootstrap", "--migrate", "--seed"]
    volumes: ["files:/data/files"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@db:5432/knowledge
      FILE_ROOT: /data/files
    command: ["uvicorn", "knowledge_agent.api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: ["files:/data/files"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@db:5432/knowledge
      FILE_ROOT: /data/files
      EMBEDDING_BASE_URL: http://embedding:8001
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      EMBEDDING_DIM: 512
      EMBEDDING_API_KEY: local-only
    command: ["python", "-m", "knowledge_agent.worker"]
    volumes: ["files:/data/files"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1g
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    depends_on:
      init: {condition: service_completed_successfully}
      embedding: {condition: service_healthy}
  embedding:
    build:
      context: ./backend
      args: {LOCAL_EMBEDDING: "true"}
    environment:
      MODEL_API_KEY: ""
    command: ["uvicorn", "knowledge_agent.local_embeddings:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes: ["./runtime/models:/app/runtime/models:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  database:
  files:
